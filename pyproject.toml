[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-cost-sim"
version = "0.2.0"
description = "Educational stock execution-cost simulator with an Alpaca-based minute-bar data pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.43.0",
  "pandas>=2.2.0",
  "PyYAML>=6.0",
  "pyarrow>=15.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
execsim = "execsim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
